default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "1234") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "db") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "cats_warehouse_development") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "cats_warehouse_development") %>
    database_tasks: false

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_DB", "cats_warehouse_test") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_DB", "cats_warehouse_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "cats_warehouse_development") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "cats_warehouse_development") %>
    database_tasks: false
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "cats_warehouse_development") %>
    database_tasks: false
